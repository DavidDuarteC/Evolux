name: Sync Forks

on:
  push:
    branches: [main, Dev]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to forks
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
          FORKS: ${{ vars.FORK_REPOS }}
        run: |
          if [ -z "$FORKS" ]; then
            echo "No forks configured."
            exit 0
          fi

          BRANCH="${{ github.ref_name }}"
          OWNER_REPO="${{ github.repository }}"

          git clone "https://${GH_TOKEN}@github.com/${OWNER_REPO}.git" /tmp/repo
          cd /tmp/repo
          git checkout "$BRANCH"

          for fork in $FORKS; do
            echo "→ Syncing $fork ($BRANCH) ..."
            git push "https://${GH_TOKEN}@github.com/${fork}.git" "$BRANCH" --force
            echo "✔ $fork synced"
          done

name: Sync Forks

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to forks
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
          FORKS: ${{ vars.FORK_REPOS }}
        run: |
          if [ -z "$FORKS" ]; then
            echo "No forks configured."
            echo "Set FORK_REPOS as a repository variable (Settings → Variables)."
            echo "Format: friend1/repo friend2/repo"
            exit 0
          fi

          for fork in $FORKS; do
            echo "→ Syncing $fork ..."
            git remote add fork "https://${GH_TOKEN}@github.com/${fork}.git"
            git push fork main --force-with-lease
            git remote remove fork
            echo "✔ $fork synced"
          done

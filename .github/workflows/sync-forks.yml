name: Sync Forks

on:
  push:
    branches: [main, Dev]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to forks
        env:
          FORKS: ${{ vars.FORK_REPOS }}
        run: |
          if [ -z "$FORKS" ]; then
            echo "No forks configured."
            exit 0
          fi

          BRANCH="${{ github.ref_name }}"
          for fork in $FORKS; do
            echo "→ Syncing $fork ($BRANCH) ..."
            git push "https://${{ secrets.FORK_SYNC_PAT }}@github.com/${fork}.git" \
              "refs/heads/${BRANCH}:refs/heads/${BRANCH}" --force-with-lease
            echo "✔ $fork synced"
          done
